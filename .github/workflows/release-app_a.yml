# app_a 専用のリリースフロー（再利用可能ワークフロー）
# ディスパッチャ(release.yml)から workflow_call で呼び出される
# app_a 固有の処理（例: リリース前プロビジョニング）をここに閉じ込める
name: Release app_a

on:
  workflow_call:
    inputs:
      release_type:
        description: バージョンの上げ方（semver）
        type: string
        required: true
      dry_run:
        description: ドライラン（実際のリリース処理をスキップ）
        type: boolean
        required: true

# app_a への二重リリースを防ぐ（app_a 単位で直列化。app_b とは独立）
concurrency:
  group: release-app_a
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: フロー開始の明示
        run: |
          echo "🅰️ app_a のリリースフローを開始（release_type=${{ inputs.release_type }} / dry_run=${{ inputs.dry_run }}）"

      - name: チェックアウト
        uses: actions/checkout@v4

      - name: pnpm セットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      # ▼ app_a 固有: リリース前プロビジョニング（app_b には無い工程）
      - name: プロビジョニング（app_a 固有・ダミー）
        run: |
          echo "TODO: app_a 用のリソースを準備する"
          echo "（例: DB マイグレーション / ストレージバケット作成 / シークレット同期 など）"

      - name: ビルド（app_a・ダミー）
        run: |
          echo "TODO: app_a のビルドを実行する"

      - name: 疎通確認（app_a）
        run: |
          echo "::group::smoke test (app_a)"
          PORT=3001 node apps/app_a/src/server.js &
          pid=$!
          sleep 1
          curl -sf http://localhost:3001/release-check
          echo ""
          kill "$pid"
          echo "::endgroup::"

      # ▼ app_a 固有: デプロイ手段（app_b とは別物の想定）
      - name: デプロイ（app_a 固有・ダミー）
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🟡 dry_run=true: app_a のデプロイをスキップ（${{ inputs.release_type }} で上げる想定）"
          else
            echo "🟢 app_a 固有のデプロイを実行する"
            echo "（例: ./scripts/deploy-app-a.sh / 専用の PaaS への push など）"
          fi

      - name: サマリ出力（app_a）
        run: |
          {
            echo "## app_a リリース検証サマリ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| release_type | ${{ inputs.release_type }} |"
            echo "| dry_run | ${{ inputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"
