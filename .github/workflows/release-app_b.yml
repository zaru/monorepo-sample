# app_b 専用のリリースフロー（再利用可能ワークフロー）
# ディスパッチャ(release.yml)から workflow_call で呼び出される
# app_a とは意図的に異なる工程（プロビジョニング無し / 別のデプロイ手段）にしている
name: Release app_b

on:
  workflow_call:
    inputs:
      release_type:
        description: バージョンの上げ方（semver）
        type: string
        required: true
      dry_run:
        description: ドライラン（実際のリリース処理をスキップ）
        type: boolean
        required: true

# app_b への二重リリースを防ぐ（app_b 単位で直列化。app_a とは独立）
concurrency:
  group: release-app_b
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: フロー開始の明示
        run: |
          echo "🅱️ app_b のリリースフローを開始（release_type=${{ inputs.release_type }} / dry_run=${{ inputs.dry_run }}）"

      - name: チェックアウト
        uses: actions/checkout@v4

      - name: pnpm セットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: ビルド（app_b・ダミー）
        run: |
          echo "TODO: app_b のビルドを実行する"

      # ▼ app_b 固有: コンテナイメージ化（app_a には無い工程の例）
      - name: コンテナイメージのビルド（app_b 固有・ダミー）
        run: |
          echo "TODO: app_b を Docker イメージとしてビルドする"
          echo "（例: docker build -t app_b:${{ inputs.release_type }} apps/app_b）"

      - name: 疎通確認（app_b）
        run: |
          echo "::group::smoke test (app_b)"
          PORT=3002 node apps/app_b/src/server.js &
          pid=$!
          sleep 1
          curl -sf http://localhost:3002/release-check
          echo ""
          kill "$pid"
          echo "::endgroup::"

      # ▼ app_b 固有: デプロイ手段（app_a とは別物の想定）
      - name: デプロイ（app_b 固有・ダミー）
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🟡 dry_run=true: app_b のデプロイをスキップ（${{ inputs.release_type }} で上げる想定）"
          else
            echo "🟢 app_b 固有のデプロイを実行する"
            echo "（例: コンテナレジストリへ push / Kubernetes へ rollout など）"
          fi

      - name: サマリ出力（app_b）
        run: |
          {
            echo "## app_b リリース検証サマリ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| release_type | ${{ inputs.release_type }} |"
            echo "| dry_run | ${{ inputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"
