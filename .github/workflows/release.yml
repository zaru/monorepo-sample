# 手動トリガー（workflow_dispatch）でのリリースフロー検証用ワークフロー（ディスパッチャ）
# 実体は app ごとの再利用可能ワークフロー(release-app_a.yml / release-app_b.yml)に分離している。
# 各 app の boolean(チェックボックス)で対象を複数選択でき、チェックした app だけが実行される。
# チェックしなかった app のジョブは Actions のグラフ上で skipped として表示されるため、
# 「どの app がリリースされたか」を目視で確認できる。
#
# workflow_dispatch にはマルチセレクトの入力タイプが無いため、app ごとの boolean で代替している。
name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      app_a:
        description: app_a をリリースする
        type: boolean
        required: true
        default: false
      app_b:
        description: app_b をリリースする
        type: boolean
        required: true
        default: false
      release_type:
        description: バージョンの上げ方（semver）
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: ドライラン（実際のリリース処理をスキップ）
        type: boolean
        required: true
        default: true

# 二重リリース防止の concurrency は app 単位で制御したいため、
# 各 app の再利用可能ワークフロー(release-app_a.yml / release-app_b.yml)側に定義している。

jobs:
  # app_a にチェックが入っている場合だけ実行（app_a 専用フローを呼び出す）
  release-app_a:
    if: ${{ inputs.app_a }}
    uses: ./.github/workflows/release-app_a.yml
    with:
      release_type: ${{ inputs.release_type }}
      dry_run: ${{ inputs.dry_run }}

  # app_b にチェックが入っている場合だけ実行（app_b 専用フローを呼び出す）
  # release-app_a とは needs で繋いでいないため両者は並列実行される
  release-app_b:
    if: ${{ inputs.app_b }}
    uses: ./.github/workflows/release-app_b.yml
    with:
      release_type: ${{ inputs.release_type }}
      dry_run: ${{ inputs.dry_run }}
