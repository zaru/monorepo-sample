# 手動トリガー（workflow_dispatch）でのリリースフロー検証用ワークフロー（ディスパッチャ）
# 実体は app ごとの再利用可能ワークフロー(release-app_a.yml / release-app_b.yml)に分離している。
# target に応じて各 app のジョブを条件起動し、選ばれた app だけが実行される。
# 選ばれなかった app のジョブは Actions のグラフ上で skipped として表示されるため、
# 「どの app がリリースされたか」を目視で確認できる。
name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: リリース対象のアプリ
        type: choice
        required: true
        default: all
        options:
          - all
          - app_a
          - app_b
      release_type:
        description: バージョンの上げ方（semver）
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: ドライラン（実際のリリース処理をスキップ）
        type: boolean
        required: true
        default: true

# 同一対象への二重リリースを防ぐ
concurrency:
  group: release-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  # app_a を対象に含む場合だけ実行（app_a 専用フローを呼び出す）
  release-app_a:
    if: ${{ inputs.target == 'all' || inputs.target == 'app_a' }}
    uses: ./.github/workflows/release-app_a.yml
    with:
      release_type: ${{ inputs.release_type }}
      dry_run: ${{ inputs.dry_run }}

  # app_b を対象に含む場合だけ実行（app_b 専用フローを呼び出す）
  # release-app_a とは needs で繋いでいないため両者は並列実行される
  release-app_b:
    if: ${{ inputs.target == 'all' || inputs.target == 'app_b' }}
    uses: ./.github/workflows/release-app_b.yml
    with:
      release_type: ${{ inputs.release_type }}
      dry_run: ${{ inputs.dry_run }}
